<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Comidas en Obra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col overflow-hidden">

    <header class="bg-gray-900 text-white p-4 shadow-md flex justify-between items-center shrink-0">
        <h1 class="text-xl font-bold">Registro Obra V3</h1>
        <div class="flex items-center gap-3">
            <span id="syncBadge" class="bg-yellow-500 text-xs text-black font-bold px-2 py-1 rounded-full hidden">0 Pendientes</span>
            <div id="statusIndicator" class="flex items-center gap-1 text-sm">
                <span class="w-3 h-3 rounded-full bg-gray-400" id="statusDot"></span>
                <span id="statusText">Verificando...</span>
            </div>
        </div>
    </header>

    <nav class="flex bg-white shadow shrink-0">
        <button onclick="switchTab('registro')" id="tab-registro" class="flex-1 py-3 text-center font-bold border-b-4 border-blue-600 text-blue-600">Registro Rápido</button>
        <button onclick="switchTab('resumen')" id="tab-resumen" class="flex-1 py-3 text-center font-bold border-b-4 border-transparent text-gray-500">Resumen Semanal</button>
    </nav>

    <main class="flex-1 overflow-y-auto p-4 relative">
        
        <!-- REGISTRO -->
        <div id="view-registro" class="space-y-6 block pb-20">
            <div class="bg-white p-4 rounded-xl shadow">
                <div class="flex justify-between mb-3 items-center">
                    <label class="font-bold text-gray-700">Trabajador</label>
                    <button onclick="openModal('workerModal')" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-bold text-sm shadow-sm">+ Nuevo Local</button>
                </div>
                <input type="text" id="searchInput" placeholder="Buscar por nombre..." class="w-full p-3 border rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-3" oninput="renderWorkersUI()">
                
                <div id="workerGrid" class="max-h-64 overflow-y-auto pr-1"></div>

                <div id="selectedWorkerDisplay" class="hidden mt-2 p-4 bg-blue-600 text-white border-2 border-blue-800 rounded-xl flex justify-between items-center shadow-lg">
                    <div>
                        <div class="text-xs text-blue-200 uppercase font-bold tracking-wider" id="swSquad"></div>
                        <div id="swName" class="font-black text-2xl"></div>
                    </div>
                    <button onclick="clearWorkerSelection()" class="bg-white text-blue-800 font-black rounded-full w-10 h-10 flex items-center justify-center text-xl shadow">✕</button>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow">
                <label class="font-bold text-gray-700 mb-2 block">Monto a Registar</label>
                <div class="text-5xl font-black text-center text-gray-800 bg-gray-100 p-4 rounded-lg mb-4 tracking-tight" id="montoDisplay">$0</div>
                <div class="grid grid-cols-4 gap-2 mb-2">
                    <button onclick="addMonto(80)" class="col-span-2 bg-blue-600 active:bg-blue-800 text-white p-4 rounded-lg text-2xl font-bold shadow">+$80</button>
                    <button onclick="addMonto(10)" class="bg-blue-500 active:bg-blue-700 text-white p-4 rounded-lg text-xl shadow">+$10</button>
                    <button onclick="addMonto(50)" class="bg-blue-500 active:bg-blue-700 text-white p-4 rounded-lg text-xl shadow">+$50</button>
                </div>
                <div class="grid grid-cols-4 gap-2 mb-2">
                    <button onclick="addMonto(1)" class="bg-gray-200 active:bg-gray-400 text-gray-800 p-3 rounded-lg font-bold shadow">+$1</button>
                    <button onclick="addMonto(5)" class="bg-gray-200 active:bg-gray-400 text-gray-800 p-3 rounded-lg font-bold shadow">+$5</button>
                    <button onclick="addMonto(100)" class="bg-gray-200 active:bg-gray-400 text-gray-800 p-3 rounded-lg font-bold shadow">+$100</button>
                    <button onclick="addMonto(500)" class="bg-gray-200 active:bg-gray-400 text-gray-800 p-3 rounded-lg font-bold shadow">+$500</button>
                </div>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="addMonto(-10)" class="col-span-2 bg-red-100 active:bg-red-300 text-red-700 p-3 rounded-lg font-bold shadow">-$10 (Corregir)</button>
                    <button onclick="clearMonto()" class="col-span-2 bg-red-500 active:bg-red-700 text-white p-3 rounded-lg font-bold shadow">Limpiar Todo</button>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow">
                <label class="font-bold text-gray-700 mb-2 block">Tipo de Movimiento</label>
                <div class="grid grid-cols-2 gap-3" id="typeSelectors">
                    <button onclick="selectType('Desayuno')" id="btn-Desayuno" class="type-btn bg-orange-100 border-2 border-transparent text-orange-800 p-4 rounded-lg font-bold text-lg transition-all">Desayuno</button>
                    <button onclick="selectType('Comida')" id="btn-Comida" class="type-btn bg-green-100 border-2 border-transparent text-green-800 p-4 rounded-lg font-bold text-lg transition-all">Comida</button>
                    <button onclick="selectType('Soda/Extra')" id="btn-SodaExtra" class="type-btn bg-purple-100 border-2 border-transparent text-purple-800 p-4 rounded-lg font-bold text-lg transition-all">Soda/Extra</button>
                    <button onclick="selectType('Abono')" id="btn-Abono" class="type-btn bg-blue-100 border-2 border-transparent text-blue-800 p-4 rounded-lg font-bold text-lg transition-all">Abono/Pago</button>
                </div>
            </div>

            <button onclick="registrarMovimiento()" class="w-full bg-gray-900 active:bg-black text-white p-5 rounded-xl text-2xl font-black shadow-xl mb-6">REGISTRAR</button>
        </div>

        <!-- RESUMEN -->
        <div id="view-resumen" class="hidden pb-20">
            <div class="flex flex-col gap-4">
                <button onclick="forceSync()" class="w-full bg-blue-600 active:bg-blue-800 text-white p-4 rounded-xl font-bold shadow flex justify-center items-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Sincronizar con Google Sheets
                </button>

                <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow">
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">Saldos (App + Sheets)</h2>
                        <p class="text-xs text-gray-500">Muestra datos sincronizados.</p>
                    </div>
                    <button onclick="exportToExcel()" class="bg-green-600 text-white px-3 py-2 rounded-lg font-bold shadow flex items-center gap-2 text-sm">
                        Descargar Excel
                    </button>
                </div>

                <div class="bg-white rounded-xl shadow overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse" id="summaryTable">
                            <thead>
                                <tr class="bg-gray-100 text-gray-600 text-sm border-b">
                                    <th class="p-3 font-bold">Trabajador</th>
                                    <th class="p-3 font-bold text-right">Consumido</th>
                                    <th class="p-3 font-bold text-right">Abonado</th>
                                    <th class="p-3 font-bold text-right">Saldo Final</th>
                                </tr>
                            </thead>
                            <tbody id="summaryBody" class="text-sm"></tbody>
                        </table>
                    </div>
                </div>

                <button onclick="resetearApp()" class="w-full bg-red-100 text-red-700 p-3 rounded-xl font-bold shadow text-sm mt-8 border border-red-300">
                    Borrar Datos Locales y Recargar
                </button>
            </div>
        </div>
    </main>

    <!-- Modales -->
    <div id="workerModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm shadow-2xl">
            <h3 class="font-bold text-lg mb-4">Agregar Trabajador</h3>
            <input type="text" id="newWorkerName" placeholder="Nombre completo o Apodo" class="w-full p-3 border rounded-lg mb-4 text-lg">
            
            <div class="flex justify-between items-center mb-2">
                <label class="text-sm font-bold text-gray-600">Cuadrilla / Sección</label>
                <button onclick="openModal('squadModal')" class="text-blue-600 text-sm font-bold bg-blue-50 px-2 py-1 rounded">+ Nueva</button>
            </div>
            <select id="newWorkerSquad" class="w-full p-3 border rounded-lg mb-6 bg-white text-lg"></select>
            
            <div class="flex gap-3">
                <button onclick="closeModal('workerModal')" class="flex-1 p-4 bg-gray-200 rounded-lg font-bold text-gray-700">Cancelar</button>
                <button onclick="saveWorker()" class="flex-1 p-4 bg-blue-600 text-white rounded-lg font-bold">Guardar</button>
            </div>
        </div>
    </div>

    <div id="squadModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm shadow-2xl">
            <h3 class="font-bold text-lg mb-4">Agregar Cuadrilla</h3>
            <input type="text" id="newSquadName" placeholder="Ej. Carpinteros" class="w-full p-3 border rounded-lg mb-6 text-lg">
            <div class="flex gap-3">
                <button onclick="closeModal('squadModal')" class="flex-1 p-4 bg-gray-200 rounded-lg font-bold text-gray-700">Cancelar</button>
                <button onclick="saveSquad()" class="flex-1 p-4 bg-blue-600 text-white rounded-lg font-bold">Guardar</button>
            </div>
        </div>
    </div>

    <!-- EL Z-INDEX ESTÁ AHORA EN 9999 PARA QUE NUNCA QUEDE OCULTO -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl transition-opacity duration-300 opacity-0 pointer-events-none z-[9999] flex items-center gap-2 font-bold text-center w-max max-w-xs">
        <span id="toastMsg">Mensaje</span>
    </div>

    <script>
        // PEGA AQUÍ TU URL
        const WEBHOOK_URL = 'URL_DE_TU_WEBHOOK_AQUI'; 

        let db;
        let currentMonto = 0;
        let currentWorkerName = null;
        let currentType = null;
        let workers = [];
        let squads = [];

        const request = indexedDB.open('ComidasDB', 3); 
        
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (db.objectStoreNames.contains('workers')) db.deleteObjectStore('workers');
            if (db.objectStoreNames.contains('squads')) db.deleteObjectStore('squads');
            if (db.objectStoreNames.contains('transactions')) db.deleteObjectStore('transactions');

            db.createObjectStore('workers', { keyPath: 'name' }); 
            db.createObjectStore('squads', { keyPath: 'name' });
            const txStore = db.createObjectStore('transactions', { keyPath: 'id', autoIncrement: true });
            txStore.createIndex('synced', 'synced', { unique: false });
        };

        request.onsuccess = (e) => {
            db = e.target.result;
            loadSquads();
            loadWorkers();
            updateSyncBadge();
            checkConnection();
        };

        function getTijuanaTimestamp() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('es-MX', {
                timeZone: 'America/Tijuana', year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'long', hour12: false
            });
            const parts = formatter.formatToParts(now);
            const p = {}; parts.forEach(({type, value}) => p[type] = value);
            let day = p.weekday.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            return { date: `${p.year}-${p.month}-${p.day}`, time: `${p.hour}:${p.minute}:${p.second}`, day: day, rawTime: now.getTime() };
        }

        function switchTab(tab) {
            document.getElementById('view-registro').classList.toggle('hidden', tab !== 'registro');
            document.getElementById('view-resumen').classList.toggle('hidden', tab !== 'resumen');
            document.getElementById('tab-registro').className = tab === 'registro' ? 'flex-1 py-3 text-center font-bold border-b-4 border-blue-600 text-blue-600' : 'flex-1 py-3 text-center font-bold border-b-4 border-transparent text-gray-500';
            document.getElementById('tab-resumen').className = tab === 'resumen' ? 'flex-1 py-3 text-center font-bold border-b-4 border-blue-600 text-blue-600' : 'flex-1 py-3 text-center font-bold border-b-4 border-transparent text-gray-500';
            if (tab === 'resumen') buildSummaryTable();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 3000);
        }

        function addMonto(val) { currentMonto = Math.max(0, currentMonto + val); updateMontoDisplay(); }
        function clearMonto() { currentMonto = 0; updateMontoDisplay(); }
        function updateMontoDisplay() { document.getElementById('montoDisplay').innerText = `$${currentMonto}`; }

        function selectType(type) {
            currentType = type;
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.remove('border-gray-800', 'shadow-inner', 'ring-4', 'ring-gray-300');
                btn.classList.add('border-transparent');
            });
            const typeClass = type === 'Soda/Extra' ? 'SodaExtra' : type;
            document.getElementById(`btn-${typeClass}`).classList.remove('border-transparent');
            document.getElementById(`btn-${typeClass}`).classList.add('border-gray-800', 'shadow-inner', 'ring-4', 'ring-gray-300');
        }

        // --- Cargar cuadrillas con autoselección ---
        function loadSquads(autoSelectName = null) {
            db.transaction('squads').objectStore('squads').getAll().onsuccess = (e) => {
                squads = e.target.result;
                const select = document.getElementById('newWorkerSquad');
                select.innerHTML = '<option value="" disabled selected>Selecciona cuadrilla</option>';
                squads.forEach(s => {
                    const selected = (s.name === autoSelectName) ? 'selected' : '';
                    select.innerHTML += `<option value="${s.name}" ${selected}>${s.name}</option>`;
                });
            };
        }

        function saveSquad() {
            const name = document.getElementById('newSquadName').value.trim();
            if (!name) return showToast('⚠️ Escribe el nombre de la cuadrilla');
            db.transaction('squads', 'readwrite').objectStore('squads').put({ name: name }).onsuccess = () => { 
                loadSquads(name); // <-- Esto hace que se seleccione automáticamente al guardar
                closeModal('squadModal'); 
                document.getElementById('newSquadName').value = ''; 
                showToast('Cuadrilla guardada y seleccionada'); 
            };
        }

        function loadWorkers() {
            db.transaction('workers').objectStore('workers').getAll().onsuccess = (e) => {
                workers = e.target.result;
                renderWorkersUI();
                if(!document.getElementById('view-resumen').classList.contains('hidden')) buildSummaryTable();
            };
        }

        function saveWorker() {
            const name = document.getElementById('newWorkerName').value.trim();
            const squad = document.getElementById('newWorkerSquad').value;
            
            // Validaciones con mensajes claros
            if (!name) return showToast('⚠️ Escribe el nombre del trabajador');
            if (!squad) return showToast('⚠️ Por favor selecciona o crea una Cuadrilla');
            
            const newWorker = { 
                name: name, squad: squad, 
                totalSemana:0, totalExtras:0, abonado:0, saldo:0, faltanteAnt:0, abonoAnt:0,
                lunes:{des:0,com:0,soda:0}, martes:{des:0,com:0,soda:0}, miercoles:{des:0,com:0,soda:0},
                jueves:{des:0,com:0,soda:0}, viernes:{des:0,com:0,soda:0}, sabado:{des:0,com:0,soda:0}
            };
            db.transaction('workers', 'readwrite').objectStore('workers').put(newWorker).onsuccess = () => { 
                loadWorkers(); closeModal('workerModal'); document.getElementById('newWorkerName').value = ''; showToast('Trabajador guardado'); 
            };
        }

        function renderWorkersUI() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('workerGrid');
            container.innerHTML = '';
            const grouped = {};
            
            workers.forEach(w => {
                if(query && !w.name.toLowerCase().includes(query)) return;
                if(!grouped[w.squad]) grouped[w.squad] = [];
                grouped[w.squad].push(w);
            });

            if (Object.keys(grouped).length === 0) { container.innerHTML = '<p class="text-gray-400 text-center py-4">Sin datos. Sincroniza o agrega uno.</p>'; return; }

            for(const [squad, squadWorkers] of Object.entries(grouped)) {
                let html = `<div class="mb-4"><div class="sticky top-0 bg-white bg-opacity-90 py-1 mb-2 border-b-2 border-gray-200 z-10"><h4 class="font-black text-gray-400 uppercase text-xs tracking-wider">${squad}</h4></div><div class="grid grid-cols-2 gap-2">`;
                squadWorkers.forEach(w => {
                    html += `<button onclick="selectWorker('${w.name}')" class="bg-gray-50 border border-gray-200 p-3 rounded-xl text-left shadow-sm active:bg-blue-100 transition-colors flex flex-col justify-center min-h-[60px]"><span class="font-bold text-gray-800 text-sm leading-tight">${w.name}</span></button>`;
                });
                container.innerHTML += html + `</div></div>`;
            }
        }

        function selectWorker(name) {
            const worker = workers.find(w => w.name === name);
            currentWorkerName = worker.name;
            document.getElementById('swName').innerText = worker.name;
            document.getElementById('swSquad').innerText = worker.squad;
            document.getElementById('searchInput').classList.add('hidden');
            document.getElementById('workerGrid').classList.add('hidden');
            document.getElementById('selectedWorkerDisplay').classList.remove('hidden');
        }

        function clearWorkerSelection() {
            currentWorkerName = null;
            document.getElementById('searchInput').classList.remove('hidden');
            document.getElementById('workerGrid').classList.remove('hidden');
            document.getElementById('selectedWorkerDisplay').classList.add('hidden');
            document.getElementById('searchInput').value = '';
            renderWorkersUI();
        }

        function registrarMovimiento() {
            if (!currentWorkerName) return showToast('⚠️ Selecciona un trabajador');
            if (currentMonto <= 0) return showToast('⚠️ Monto debe ser mayor a $0');
            if (!currentType) return showToast('⚠️ Selecciona el tipo');

            const worker = workers.find(w => w.name === currentWorkerName);
            const tijuana = getTijuanaTimestamp();

            const txData = {
                workerName: worker.name, squadName: worker.squad, amount: currentMonto, type: currentType,
                date: tijuana.date, time: tijuana.time, day: tijuana.day, timestamp: tijuana.rawTime, synced: 0
            };

            db.transaction('transactions', 'readwrite').objectStore('transactions').add(txData).onsuccess = () => {
                showToast(`✅ $${currentMonto} guardado`);
                clearMonto(); clearWorkerSelection(); updateSyncBadge();
                if(navigator.onLine) forceSync();
            };
        }

        function buildSummaryTable() {
            if (!db) return;
            db.transaction('transactions').objectStore('transactions').index('synced').getAll(0).onsuccess = (e) => {
                const pendingTxs = e.target.result;
                const tbody = document.getElementById('summaryBody');
                tbody.innerHTML = '';
                const summary = JSON.parse(JSON.stringify(workers)); 

                pendingTxs.forEach(t => {
                    let w = summary.find(x => x.name === t.workerName);
                    if (w) {
                        if (t.type === 'Abono') w.abonado += t.amount;
                        else w.totalSemana += t.amount;
                        w.saldo = (w.totalSemana + w.totalExtras + w.faltanteAnt) - (w.abonado + w.abonoAnt);
                    }
                });

                summary.forEach(row => {
                    if (row.totalSemana > 0 || row.totalExtras > 0 || row.abonado > 0 || row.saldo !== 0) {
                        tbody.innerHTML += `
                            <tr class="border-b">
                                <td class="p-3"><div class="font-bold text-gray-800">${row.name}</div><div class="text-xs text-gray-500">${row.squad}</div></td>
                                <td class="p-3 text-right text-red-600 font-semibold">$${row.totalSemana + row.totalExtras}</td>
                                <td class="p-3 text-right text-green-600 font-semibold">$${row.abonado}</td>
                                <td class="p-3 text-right font-black ${row.saldo > 0 ? 'text-red-700' : row.saldo < 0 ? 'text-green-700' : 'text-gray-800'}">$${row.saldo}</td>
                            </tr>
                        `;
                    }
                });
            };
        }

        async function forceSync() {
            if (!navigator.onLine) return showToast('Sin internet');
            if(WEBHOOK_URL === 'URL_DE_TU_WEBHOOK_AQUI') return showToast('⚠️ Falta configurar URL');

            showToast('Conectando con Google Sheets...');
            
            // Recolectar datos pendientes y trabajadores locales
            const pendingTxs = await new Promise(res => db.transaction('transactions').objectStore('transactions').index('synced').getAll(0).onsuccess = e => res(e.target.result));
            const localWorkers = await new Promise(res => db.transaction('workers').objectStore('workers').getAll().onsuccess = e => res(e.target.result));

            try {
                const response = await fetch(WEBHOOK_URL, { 
                    method: 'POST', redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ transactions: pendingTxs, workers: localWorkers }) 
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    const txUpdate = db.transaction(['transactions', 'workers', 'squads'], 'readwrite');
                    
                    // 1. Marcar transacciones como subidas
                    const storeTx = txUpdate.objectStore('transactions');
                    pendingTxs.forEach(p => { p.synced = 1; storeTx.put(p); });

                    // 2. Reemplazar base de datos con la maestra de Sheets
                    const storeWorkers = txUpdate.objectStore('workers');
                    const storeSquads = txUpdate.objectStore('squads');
                    storeWorkers.clear(); storeSquads.clear();
                    
                    let uniqueSquads = new Set();
                    result.workers.forEach(w => { storeWorkers.put(w); uniqueSquads.add(w.squad); });
                    uniqueSquads.forEach(sq => storeSquads.put({ name: sq }));

                    txUpdate.oncomplete = () => { 
                        showToast('✅ Sincronizado con Sheets'); 
                        updateSyncBadge(); loadWorkers(); 
                    };
                } else { showToast('❌ Error: ' + result.message); }
            } catch (err) { showToast('❌ Error de red'); }
        }

        function exportToExcel() {
            const sortedWorkers = [...workers].sort((a, b) => a.squad.localeCompare(b.squad));
            const wsData = [
                ['#', 'NOMBRE', 'CUADRILLA', 'FALTANTE ANT.', 'ABONO ANT.', 'TOTAL SEM. ($)', 'TOTAL EXTRAS', 'ABONÓ ($)', 'SALDO ($)', 'LUNES','','','MARTES','','','MIÉRCOLES','','','JUEVES','','','VIERNES','','','SÁBADO','',''],
                ['','','','','','','','','','DES','COM','SODA','DES','COM','SODA','DES','COM','SODA','DES','COM','SODA','DES','COM','SODA','DES','COM','SODA']
            ];
            let index = 1;
            sortedWorkers.forEach(w => {
                if(w.totalSemana > 0 || w.totalExtras > 0 || w.abonado > 0 || w.faltanteAnt > 0 || w.saldo > 0) {
                    wsData.push([index++, w.name, w.squad, w.faltanteAnt, w.abonoAnt, w.totalSemana, w.totalExtras, w.abonado, w.saldo, w.lunes.des||'', w.lunes.com||'', w.lunes.soda||'', w.martes.des||'', w.martes.com||'', w.martes.soda||'', w.miercoles.des||'', w.miercoles.com||'', w.miercoles.soda||'', w.jueves.des||'', w.jueves.com||'', w.jueves.soda||'', w.viernes.des||'', w.viernes.com||'', w.viernes.soda||'', w.sabado.des||'', w.sabado.com||'', w.sabado.soda||'']);
                }
            });
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            ws['!merges'] = [{s:{r:0,c:0},e:{r:1,c:0}}, {s:{r:0,c:1},e:{r:1,c:1}}, {s:{r:0,c:2},e:{r:1,c:2}}, {s:{r:0,c:3},e:{r:1,c:3}}, {s:{r:0,c:4},e:{r:1,c:4}}, {s:{r:0,c:5},e:{r:1,c:5}}, {s:{r:0,c:6},e:{r:1,c:6}}, {s:{r:0,c:7},e:{r:1,c:7}}, {s:{r:0,c:8},e:{r:1,c:8}}, {s:{r:0,c:9},e:{r:0,c:11}}, {s:{r:0,c:12},e:{r:0,c:14}}, {s:{r:0,c:15},e:{r:0,c:17}}, {s:{r:0,c:18},e:{r:0,c:20}}, {s:{r:0,c:21},e:{r:0,c:23}}, {s:{r:0,c:24},e:{r:0,c:26}}];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Control");
            XLSX.writeFile(wb, `Control_${getTijuanaTimestamp().date}.xlsx`);
        }

        function updateSyncBadge() {
            if (!db) return;
            db.transaction('transactions').objectStore('transactions').index('synced').getAll(0).onsuccess = (e) => {
                const count = e.target.result.length;
                const badge = document.getElementById('syncBadge');
                if (count > 0) { badge.innerText = `${count} Pendientes`; badge.classList.remove('hidden'); } else badge.classList.add('hidden');
            };
        }

        function checkConnection() {
            if (navigator.onLine) { document.getElementById('statusDot').className = 'w-3 h-3 rounded-full bg-green-500'; document.getElementById('statusText').innerText = 'En Línea'; updateSyncBadge(); } 
            else { document.getElementById('statusDot').className = 'w-3 h-3 rounded-full bg-red-500'; document.getElementById('statusText').innerText = 'Offline'; }
        }
        window.addEventListener('online', () => { checkConnection(); forceSync(); });
        window.addEventListener('offline', checkConnection);

        function resetearApp() {
            if(confirm("¿Seguro que quieres borrar la base de datos local? Si tienes pendientes por sincronizar, se perderán.")) {
                indexedDB.deleteDatabase("ComidasDB");
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for(let registration of registrations) { registration.unregister(); }
                });
                alert("App reiniciada. La página se recargará ahora.");
                window.location.reload(true);
            }
        }

        if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js')); }
    </script>
</body>
</html>
