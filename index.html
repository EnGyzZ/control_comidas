<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Comidas en Obra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header / Estado -->
    <header class="bg-gray-900 text-white p-4 shadow-md flex justify-between items-center shrink-0">
        <h1 class="text-xl font-bold">Registro Obra</h1>
        <div class="flex items-center gap-3">
            <span id="syncBadge" class="bg-yellow-500 text-xs text-black font-bold px-2 py-1 rounded-full hidden">0 Pendientes</span>
            <div id="statusIndicator" class="flex items-center gap-1 text-sm">
                <span class="w-3 h-3 rounded-full bg-gray-400" id="statusDot"></span>
                <span id="statusText">Verificando...</span>
            </div>
        </div>
    </header>

    <!-- Navegación por Pestañas -->
    <nav class="flex bg-white shadow shrink-0">
        <button onclick="switchTab('registro')" id="tab-registro" class="flex-1 py-3 text-center font-bold border-b-4 border-blue-600 text-blue-600">Registro Rápido</button>
        <button onclick="switchTab('resumen')" id="tab-resumen" class="flex-1 py-3 text-center font-bold border-b-4 border-transparent text-gray-500">Resumen Semanal</button>
    </nav>

    <!-- Contenedor Principal -->
    <main class="flex-1 overflow-y-auto p-4 relative">
        
        <!-- PESTAÑA 1: REGISTRO -->
        <div id="view-registro" class="space-y-6 block pb-20">
            
            <!-- Buscador y Selección de Trabajador Visual -->
            <div class="bg-white p-4 rounded-xl shadow">
                <div class="flex justify-between mb-3 items-center">
                    <label class="font-bold text-gray-700">Trabajador</label>
                    <button onclick="openModal('workerModal')" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-bold text-sm shadow-sm">+ Nuevo</button>
                </div>
                
                <!-- Buscador (Opcional) -->
                <input type="text" id="searchInput" placeholder="Buscar por nombre..." class="w-full p-3 border rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-3" oninput="renderWorkersUI()">
                
                <!-- Grid Visual por Cuadrillas -->
                <div id="workerGrid" class="max-h-64 overflow-y-auto pr-1">
                    <!-- Generado dinámicamente -->
                </div>

                <!-- Tarjeta de Trabajador Seleccionado -->
                <div id="selectedWorkerDisplay" class="hidden mt-2 p-4 bg-blue-600 text-white border-2 border-blue-800 rounded-xl flex justify-between items-center shadow-lg">
                    <div>
                        <div class="text-xs text-blue-200 uppercase font-bold tracking-wider" id="swSquad"></div>
                        <div id="swName" class="font-black text-2xl"></div>
                    </div>
                    <button onclick="clearWorkerSelection()" class="bg-white text-blue-800 font-black rounded-full w-10 h-10 flex items-center justify-center text-xl shadow">✕</button>
                </div>
            </div>

            <!-- Totalizador / Teclado Rápido -->
            <div class="bg-white p-4 rounded-xl shadow">
                <label class="font-bold text-gray-700 mb-2 block">Monto a Registar</label>
                <div class="text-5xl font-black text-center text-gray-800 bg-gray-100 p-4 rounded-lg mb-4 tracking-tight" id="montoDisplay">$0</div>
                
                <div class="grid grid-cols-4 gap-2 mb-2">
                    <button onclick="addMonto(80)" class="col-span-2 bg-blue-600 active:bg-blue-800 text-white p-4 rounded-lg text-2xl font-bold shadow transition-colors">+$80</button>
                    <button onclick="addMonto(10)" class="bg-blue-500 active:bg-blue-700 text-white p-4 rounded-lg text-xl shadow transition-colors">+$10</button>
                    <button onclick="addMonto(50)" class="bg-blue-500 active:bg-blue-700 text-white p-4 rounded-lg text-xl shadow transition-colors">+$50</button>
                </div>
                <div class="grid grid-cols-4 gap-2 mb-2">
                    <button onclick="addMonto(1)" class="bg-gray-200 active:bg-gray-400 text-gray-800 p-3 rounded-lg font-bold shadow">+$1</button>
                    <button onclick="addMonto(5)" class="bg-gray-200 active:bg-gray-400 text-gray-800 p-3 rounded-lg font-bold shadow">+$5</button>
                    <button onclick="addMonto(100)" class="bg-gray-200 active:bg-gray-400 text-gray-800 p-3 rounded-lg font-bold shadow">+$100</button>
                    <button onclick="addMonto(500)" class="bg-gray-200 active:bg-gray-400 text-gray-800 p-3 rounded-lg font-bold shadow">+$500</button>
                </div>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="addMonto(-10)" class="col-span-2 bg-red-100 active:bg-red-300 text-red-700 p-3 rounded-lg font-bold shadow">-$10 (Corregir)</button>
                    <button onclick="clearMonto()" class="col-span-2 bg-red-500 active:bg-red-700 text-white p-3 rounded-lg font-bold shadow">Limpiar Todo</button>
                </div>
            </div>

            <!-- Tipo de Movimiento -->
            <div class="bg-white p-4 rounded-xl shadow">
                <label class="font-bold text-gray-700 mb-2 block">Tipo de Movimiento</label>
                <div class="grid grid-cols-2 gap-3" id="typeSelectors">
                    <button onclick="selectType('Desayuno')" id="btn-Desayuno" class="type-btn bg-orange-100 border-2 border-transparent text-orange-800 p-4 rounded-lg font-bold text-lg transition-all">Desayuno</button>
                    <button onclick="selectType('Comida')" id="btn-Comida" class="type-btn bg-green-100 border-2 border-transparent text-green-800 p-4 rounded-lg font-bold text-lg transition-all">Comida</button>
                    <button onclick="selectType('Soda/Extra')" id="btn-SodaExtra" class="type-btn bg-purple-100 border-2 border-transparent text-purple-800 p-4 rounded-lg font-bold text-lg transition-all">Soda/Extra</button>
                    <button onclick="selectType('Abono')" id="btn-Abono" class="type-btn bg-blue-100 border-2 border-transparent text-blue-800 p-4 rounded-lg font-bold text-lg transition-all">Abono/Pago</button>
                </div>
            </div>

            <!-- Botón de Registro -->
            <button onclick="registrarMovimiento()" class="w-full bg-gray-900 active:bg-black text-white p-5 rounded-xl text-2xl font-black shadow-xl mb-6">REGISTRAR</button>
        </div>

        <!-- PESTAÑA 2: RESUMEN -->
        <div id="view-resumen" class="hidden pb-20">
            <div class="flex flex-col gap-4">
                <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow">
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">Saldos Actuales</h2>
                        <p class="text-sm text-gray-500">Calculado localmente</p>
                    </div>
                    <button onclick="exportToExcel()" class="bg-green-600 active:bg-green-800 text-white px-4 py-2 rounded-lg font-bold shadow flex items-center gap-2 transition-colors">
                        <span>Descargar Excel</span>
                    </button>
                </div>

                <div class="bg-white rounded-xl shadow overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse" id="summaryTable">
                            <thead>
                                <tr class="bg-gray-100 text-gray-600 text-sm border-b">
                                    <th class="p-3 font-bold">Trabajador</th>
                                    <th class="p-3 font-bold text-right">Consumido</th>
                                    <th class="p-3 font-bold text-right">Abonado</th>
                                    <th class="p-3 font-bold text-right">Saldo Final</th>
                                </tr>
                            </thead>
                            <tbody id="summaryBody" class="text-sm">
                            </tbody>
                        </table>
                    </div>
                </div>

                <button onclick="forceSync()" class="w-full bg-blue-600 active:bg-blue-800 text-white p-4 rounded-xl font-bold shadow mt-4 transition-colors">Sincronizar a Google Sheets</button>
            </div>
        </div>

    </main>

    <!-- Modales -->
    <div id="workerModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm shadow-2xl">
            <h3 class="font-bold text-lg mb-4">Agregar Trabajador</h3>
            <input type="text" id="newWorkerName" placeholder="Nombre completo o Apodo" class="w-full p-3 border rounded-lg mb-4 text-lg">
            
            <div class="flex justify-between items-center mb-2">
                <label class="text-sm font-bold text-gray-600">Cuadrilla / Sección</label>
                <button onclick="openModal('squadModal')" class="text-blue-600 text-sm font-bold bg-blue-50 px-2 py-1 rounded">+ Nueva</button>
            </div>
            <select id="newWorkerSquad" class="w-full p-3 border rounded-lg mb-6 bg-white text-lg"></select>
            
            <div class="flex gap-3">
                <button onclick="closeModal('workerModal')" class="flex-1 p-4 bg-gray-200 rounded-lg font-bold text-gray-700">Cancelar</button>
                <button onclick="saveWorker()" class="flex-1 p-4 bg-blue-600 text-white rounded-lg font-bold">Guardar</button>
            </div>
        </div>
    </div>

    <div id="squadModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm shadow-2xl">
            <h3 class="font-bold text-lg mb-4">Agregar Cuadrilla</h3>
            <input type="text" id="newSquadName" placeholder="Ej. Carpinteros" class="w-full p-3 border rounded-lg mb-6 text-lg">
            <div class="flex gap-3">
                <button onclick="closeModal('squadModal')" class="flex-1 p-4 bg-gray-200 rounded-lg font-bold text-gray-700">Cancelar</button>
                <button onclick="saveSquad()" class="flex-1 p-4 bg-blue-600 text-white rounded-lg font-bold">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl transition-opacity duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2 font-bold">
        <span id="toastMsg">Mensaje</span>
    </div>

    <script>
        const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbykCvmy9nvld_E_b4C14nNkniKhtiwNQMfo3Q-0yTapB41FBQyULIEhlt9IhpSx2xvM/exec'; 

        let db;
        let currentMonto = 0;
        let currentWorkerId = null;
        let currentType = null;
        let workers = [];
        let squads = [];

        const request = indexedDB.open('ComidasDB', 1);
        
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains('workers')) db.createObjectStore('workers', { keyPath: 'id', autoIncrement: true });
            if (!db.objectStoreNames.contains('squads')) db.createObjectStore('squads', { keyPath: 'id', autoIncrement: true });
            if (!db.objectStoreNames.contains('transactions')) {
                const txStore = db.createObjectStore('transactions', { keyPath: 'id', autoIncrement: true });
                txStore.createIndex('synced', 'synced', { unique: false });
                txStore.createIndex('workerId', 'workerId', { unique: false });
            }
        };

        request.onsuccess = (e) => {
            db = e.target.result;
            loadSquads();
            loadWorkers();
            updateSyncBadge();
            checkConnection();
            buildSummaryTable();
        };

        // ZONA HORARIA TIJUANA (Obligatoria para todas las operaciones de tiempo)
        function getTijuanaTimestamp() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('es-MX', {
                timeZone: 'America/Tijuana',
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                weekday: 'long', hour12: false
            });
            const parts = formatter.formatToParts(now);
            const p = {};
            parts.forEach(({type, value}) => p[type] = value);
            
            // "lunes", "martes", etc.
            let day = p.weekday.toLowerCase(); 
            // Eliminar acentos para normalizar (miércoles -> miercoles, sábado -> sabado)
            day = day.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

            return {
                date: `${p.year}-${p.month}-${p.day}`,
                time: `${p.hour}:${p.minute}:${p.second}`,
                day: day, // normalizado para el excel
                rawTime: now.getTime()
            };
        }

        function switchTab(tab) {
            document.getElementById('view-registro').classList.toggle('hidden', tab !== 'registro');
            document.getElementById('view-resumen').classList.toggle('hidden', tab !== 'resumen');
            document.getElementById('tab-registro').className = tab === 'registro' ? 'flex-1 py-3 text-center font-bold border-b-4 border-blue-600 text-blue-600' : 'flex-1 py-3 text-center font-bold border-b-4 border-transparent text-gray-500';
            document.getElementById('tab-resumen').className = tab === 'resumen' ? 'flex-1 py-3 text-center font-bold border-b-4 border-blue-600 text-blue-600' : 'flex-1 py-3 text-center font-bold border-b-4 border-transparent text-gray-500';
            if (tab === 'resumen') buildSummaryTable();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }

        function addMonto(val) { currentMonto = Math.max(0, currentMonto + val); updateMontoDisplay(); }
        function clearMonto() { currentMonto = 0; updateMontoDisplay(); }
        function updateMontoDisplay() { document.getElementById('montoDisplay').innerText = `$${currentMonto}`; }

        function selectType(type) {
            currentType = type;
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.remove('border-gray-800', 'shadow-inner', 'ring-4', 'ring-gray-300');
                btn.classList.add('border-transparent');
            });
            const typeClass = type === 'Soda/Extra' ? 'SodaExtra' : type;
            const activeBtn = document.getElementById(`btn-${typeClass}`);
            activeBtn.classList.remove('border-transparent');
            activeBtn.classList.add('border-gray-800', 'shadow-inner', 'ring-4', 'ring-gray-300');
        }

        function loadSquads() {
            const tx = db.transaction('squads', 'readonly');
            tx.objectStore('squads').getAll().onsuccess = (e) => {
                squads = e.target.result;
                const select = document.getElementById('newWorkerSquad');
                select.innerHTML = '<option value="" disabled selected>Selecciona cuadrilla</option>';
                squads.forEach(s => select.innerHTML += `<option value="${s.name}">${s.name}</option>`);
            };
        }

        function saveSquad() {
            const name = document.getElementById('newSquadName').value.trim();
            if (!name) return;
            const tx = db.transaction('squads', 'readwrite');
            tx.objectStore('squads').add({ name });
            tx.oncomplete = () => {
                loadSquads();
                closeModal('squadModal');
                document.getElementById('newSquadName').value = '';
                showToast('Cuadrilla agregada');
            };
        }

        function loadWorkers() {
            const tx = db.transaction('workers', 'readonly');
            tx.objectStore('workers').getAll().onsuccess = (e) => {
                workers = e.target.result;
                renderWorkersUI();
            };
        }

        function saveWorker() {
            const name = document.getElementById('newWorkerName').value.trim();
            const squad = document.getElementById('newWorkerSquad').value;
            if (!name || !squad) { showToast('⚠️ Llena nombre y cuadrilla'); return; }
            const tx = db.transaction('workers', 'readwrite');
            tx.objectStore('workers').add({ name, squad });
            tx.oncomplete = () => {
                loadWorkers();
                closeModal('workerModal');
                document.getElementById('newWorkerName').value = '';
                document.getElementById('newWorkerSquad').value = '';
                showToast('Trabajador guardado');
            };
        }

        // RENDERIZADO VISUAL DE TRABAJADORES (Por Cuadrillas)
        function renderWorkersUI() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('workerGrid');
            container.innerHTML = '';

            const grouped = {};
            workers.forEach(w => {
                if(query && !w.name.toLowerCase().includes(query)) return;
                if(!grouped[w.squad]) grouped[w.squad] = [];
                grouped[w.squad].push(w);
            });

            if (Object.keys(grouped).length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center py-4">No hay trabajadores.</p>';
                return;
            }

            for(const [squad, squadWorkers] of Object.entries(grouped)) {
                const section = document.createElement('div');
                section.className = 'mb-4';
                
                // HTML de la sección de cuadrilla
                let html = `
                    <div class="sticky top-0 bg-white bg-opacity-90 py-1 mb-2 border-b-2 border-gray-200 z-10">
                        <h4 class="font-black text-gray-400 uppercase text-xs tracking-wider">${squad}</h4>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                `;
                
                // Botones de trabajadores
                squadWorkers.forEach(w => {
                    html += `
                        <button onclick="selectWorker(${w.id})" class="bg-gray-50 border border-gray-200 p-3 rounded-xl text-left shadow-sm active:bg-blue-100 transition-colors flex flex-col justify-center min-h-[60px]">
                            <span class="font-bold text-gray-800 text-sm leading-tight">${w.name}</span>
                        </button>
                    `;
                });
                
                html += `</div>`;
                section.innerHTML = html;
                container.appendChild(section);
            }
        }

        function selectWorker(id) {
            const worker = workers.find(w => w.id === id);
            currentWorkerId = worker.id;
            document.getElementById('swName').innerText = worker.name;
            document.getElementById('swSquad').innerText = worker.squad;
            
            document.getElementById('searchInput').classList.add('hidden');
            document.getElementById('workerGrid').classList.add('hidden');
            document.getElementById('selectedWorkerDisplay').classList.remove('hidden');
            document.getElementById('searchInput').value = '';
        }

        function clearWorkerSelection() {
            currentWorkerId = null;
            document.getElementById('searchInput').classList.remove('hidden');
            document.getElementById('workerGrid').classList.remove('hidden');
            document.getElementById('selectedWorkerDisplay').classList.add('hidden');
            renderWorkersUI();
        }

        function registrarMovimiento() {
            if (!currentWorkerId) { showToast('⚠️ Selecciona un trabajador'); return; }
            if (currentMonto <= 0) { showToast('⚠️ El monto debe ser mayor a $0'); return; }
            if (!currentType) { showToast('⚠️ Selecciona el tipo'); return; }

            const worker = workers.find(w => w.id === currentWorkerId);
            const tijuana = getTijuanaTimestamp();

            const txData = {
                workerId: worker.id,
                workerName: worker.name,
                squadName: worker.squad,
                amount: currentMonto,
                type: currentType,
                date: tijuana.date,
                time: tijuana.time,
                day: tijuana.day, 
                timestamp: tijuana.rawTime,
                synced: 0
            };

            const tx = db.transaction('transactions', 'readwrite');
            tx.objectStore('transactions').add(txData);
            tx.oncomplete = () => {
                showToast(`✅ $${currentMonto} guardado para ${worker.name}`);
                clearMonto();
                clearWorkerSelection();
                updateSyncBadge();
                if(navigator.onLine) forceSync();
            };
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function buildSummaryTable() {
            if (!db) return;
            const tx = db.transaction('transactions', 'readonly');
            tx.objectStore('transactions').getAll().onsuccess = (e) => {
                const transactions = e.target.result;
                const tbody = document.getElementById('summaryBody');
                tbody.innerHTML = '';
                
                const summary = {};
                workers.forEach(w => summary[w.id] = { name: w.name, squad: w.squad, consumido: 0, abonado: 0 });

                transactions.forEach(t => {
                    if (summary[t.workerId]) {
                        if (t.type === 'Abono') summary[t.workerId].abonado += t.amount;
                        else summary[t.workerId].consumido += t.amount;
                    }
                });

                Object.values(summary).forEach(row => {
                    if (row.consumido > 0 || row.abonado > 0) {
                        const saldo = row.consumido - row.abonado;
                        const tr = document.createElement('tr');
                        tr.className = "border-b";
                        tr.innerHTML = `
                            <td class="p-3"><div class="font-bold text-gray-800">${row.name}</div><div class="text-xs text-gray-500">${row.squad}</div></td>
                            <td class="p-3 text-right text-red-600 font-semibold">$${row.consumido}</td>
                            <td class="p-3 text-right text-green-600 font-semibold">$${row.abonado}</td>
                            <td class="p-3 text-right font-black ${saldo > 0 ? 'text-red-700' : saldo < 0 ? 'text-green-700' : 'text-gray-800'}">$${saldo}</td>
                        `;
                        tbody.appendChild(tr);
                    }
                });
            };
        }

        // EXPORTACIÓN A EXCEL IDÉNTICA A LA IMAGEN
        function exportToExcel() {
            const tx = db.transaction('transactions', 'readonly');
            tx.objectStore('transactions').getAll().onsuccess = (e) => {
                const data = e.target.result;
                
                // Construir base de datos de totales por trabajador
                const report = {};
                workers.forEach(w => {
                    report[w.id] = {
                        name: w.name,
                        squad: w.squad,
                        faltanteAnt: 0, // Por ahora 0, para implementar saldo pendiente histórico a futuro
                        abonoAnt: 0,
                        lunes: { des: 0, com: 0, soda: 0 },
                        martes: { des: 0, com: 0, soda: 0 },
                        miercoles: { des: 0, com: 0, soda: 0 }, // Sin acento por la normalización
                        jueves: { des: 0, com: 0, soda: 0 },
                        viernes: { des: 0, com: 0, soda: 0 },
                        sabado: { des: 0, com: 0, soda: 0 },
                        totalSemana: 0,
                        totalExtras: 0,
                        abono: 0
                    };
                });

                // Llenar datos basándose en el día extraído con hora Tijuana
                data.forEach(t => {
                    if(report[t.workerId] && report[t.workerId][t.day] !== undefined) {
                        if(t.type === 'Desayuno') {
                            report[t.workerId][t.day].des += t.amount;
                            report[t.workerId].totalSemana += t.amount;
                        } else if (t.type === 'Comida') {
                            report[t.workerId][t.day].com += t.amount;
                            report[t.workerId].totalSemana += t.amount;
                        } else if (t.type === 'Soda/Extra') {
                            report[t.workerId][t.day].soda += t.amount;
                            report[t.workerId].totalExtras += t.amount;
                        } else if (t.type === 'Abono') {
                            report[t.workerId].abono += t.amount;
                        }
                    }
                });

                // Ordenar por Cuadrilla
                const sortedWorkers = Object.values(report).sort((a, b) => a.squad.localeCompare(b.squad));

                // Formato idéntico al Excel de la imagen
                const wsData = [];
                
                // Fila 1: Encabezados Principales
                wsData.push([
                    '#', 'NOMBRE / APODO', 'FALTANTE ANT.', 'ABONO ANT.', 'TOTAL SEMANA ($)', 'TOTAL EXTRAS', 'ABONÓ / PAGÓ ($)', 'RESTA / SALDO ($)',
                    'LUNES', '', '', 'MARTES', '', '', 'MIÉRCOLES', '', '', 'JUEVES', '', '', 'VIERNES', '', '', 'SÁBADO', '', ''
                ]);

                // Fila 2: Sub-encabezados de días
                wsData.push([
                    '', '', '', '', '', '', '', '',
                    'DES', 'COM', 'SODA/EXTRA', 'DES', 'COM', 'SODA/EXTRA', 'DES', 'COM', 'SODA/EXTRA', 
                    'DES', 'COM', 'SODA/EXTRA', 'DES', 'COM', 'SODA/EXTRA', 'DES', 'COM', 'SODA/EXTRA'
                ]);

                // Filas de Datos
                let index = 1;
                sortedWorkers.forEach(w => {
                    const saldoFinal = (w.totalSemana + w.totalExtras + w.faltanteAnt) - (w.abono + w.abonoAnt);
                    
                    // Solo exportar si tuvo actividad
                    if(w.totalSemana > 0 || w.totalExtras > 0 || w.abono > 0 || w.faltanteAnt > 0) {
                        wsData.push([
                            index++, 
                            w.name, 
                            w.faltanteAnt, 
                            w.abonoAnt, 
                            w.totalSemana, 
                            w.totalExtras, 
                            w.abono, 
                            saldoFinal,
                            w.lunes.des || '', w.lunes.com || '', w.lunes.soda || '',
                            w.martes.des || '', w.martes.com || '', w.martes.soda || '',
                            w.miercoles.des || '', w.miercoles.com || '', w.miercoles.soda || '',
                            w.jueves.des || '', w.jueves.com || '', w.jueves.soda || '',
                            w.viernes.des || '', w.viernes.com || '', w.viernes.soda || '',
                            w.sabado.des || '', w.sabado.com || '', w.sabado.soda || ''
                        ]);
                    }
                });

                const ws = XLSX.utils.aoa_to_sheet(wsData);

                // Combinar celdas (Merges) para que el Excel salga formateado nativamente
                ws['!merges'] = [
                    { s: { r: 0, c: 0 }, e: { r: 1, c: 0 } }, // #
                    { s: { r: 0, c: 1 }, e: { r: 1, c: 1 } }, // NOMBRE
                    { s: { r: 0, c: 2 }, e: { r: 1, c: 2 } }, // FALTANTE ANT
                    { s: { r: 0, c: 3 }, e: { r: 1, c: 3 } }, // ABONO ANT
                    { s: { r: 0, c: 4 }, e: { r: 1, c: 4 } }, // TOTAL SEMANA
                    { s: { r: 0, c: 5 }, e: { r: 1, c: 5 } }, // TOTAL EXTRAS
                    { s: { r: 0, c: 6 }, e: { r: 1, c: 6 } }, // ABONO
                    { s: { r: 0, c: 7 }, e: { r: 1, c: 7 } }, // RESTA
                    { s: { r: 0, c: 8 }, e: { r: 0, c: 10 } }, // LUNES
                    { s: { r: 0, c: 11 }, e: { r: 0, c: 13 } }, // MARTES
                    { s: { r: 0, c: 14 }, e: { r: 0, c: 16 } }, // MIERCOLES
                    { s: { r: 0, c: 17 }, e: { r: 0, c: 19 } }, // JUEVES
                    { s: { r: 0, c: 20 }, e: { r: 0, c: 22 } }, // VIERNES
                    { s: { r: 0, c: 23 }, e: { r: 0, c: 25 } }  // SABADO
                ];

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Control_Semanal");
                const filename = `Control_${getTijuanaTimestamp().date}.xlsx`;
                XLSX.writeFile(wb, filename);
                showToast('✅ Excel formateado descargado');
            };
        }

        function updateSyncBadge() {
            if (!db) return;
            const tx = db.transaction('transactions', 'readonly');
            tx.objectStore('transactions').index('synced').getAll(0).onsuccess = (e) => {
                const count = e.target.result.length;
                const badge = document.getElementById('syncBadge');
                if (count > 0) { badge.innerText = `${count} Pendientes`; badge.classList.remove('hidden'); } 
                else badge.classList.add('hidden');
            };
        }

        function checkConnection() {
            const dot = document.getElementById('statusDot');
            const txt = document.getElementById('statusText');
            if (navigator.onLine) {
                dot.className = 'w-3 h-3 rounded-full bg-green-500';
                txt.innerText = 'En Línea';
                updateSyncBadge();
            } else {
                dot.className = 'w-3 h-3 rounded-full bg-red-500';
                txt.innerText = 'Offline';
            }
        }

        window.addEventListener('online', () => { checkConnection(); forceSync(); });
        window.addEventListener('offline', checkConnection);

        async function forceSync() {
            if (!navigator.onLine) return showToast('Sin internet');
            if(WEBHOOK_URL === 'URL_DE_TU_WEBHOOK_AQUI') return;

            const tx = db.transaction('transactions', 'readonly');
            tx.objectStore('transactions').index('synced').getAll(0).onsuccess = async (e) => {
                const pending = e.target.result;
                if (pending.length === 0) return;

                showToast(`Sincronizando ${pending.length}...`);
                try {
                    const response = await fetch(WEBHOOK_URL, { method: 'POST', body: JSON.stringify({ transactions: pending }) });
                    const result = await response.json();
                    if (result.status === 'success') {
                        const txUpdate = db.transaction('transactions', 'readwrite');
                        const store = txUpdate.objectStore('transactions');
                        pending.forEach(p => { p.synced = 1; store.put(p); });
                        txUpdate.oncomplete = () => { showToast('✅ Sincronizado'); updateSyncBadge(); };
                    }
                } catch (err) { showToast('❌ Error de red'); }
            };
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }
    </script>
</body>
</html>
